name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-22.04
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
          - name: macOS
            os: macos-latest
            bundles: |
              target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk and Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - name: Build application
        run: cargo tauri build

      # An unsigned app is reported as "damaged" by Gatekeeper on Apple
      # Silicon: make sure the bundle carries a valid (ad-hoc) signature
      - name: Check macOS code signature
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d target/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app"

      - name: Run tests
        run: cargo test --release -p rustshark-shared -p rustshark

      - name: Collect bundles and SHA-256 checksums
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          mkdir -p out
          cp $BUNDLES out/
          cd out
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          # Git Bash on Windows marks binary mode with "*": keep the plain format
          $sum * | sed 's/ \*/  /' > SHA256SUMS-${{ runner.os }}.txt
          cat SHA256SUMS-${{ runner.os }}.txt

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: out/SHA256SUMS-${{ runner.os }}.txt

      - uses: actions/upload-artifact@v6
        with:
          name: rustshark-${{ runner.os }}
          path: out/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rustshark-*
          path: dist/
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. created by hand): refresh its files
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "RustShark $TAG" \
              --generate-notes
          fi
