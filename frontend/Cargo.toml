[package]
name = "rustshark-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Interface Leptos de RustShark"

[dependencies]
rustshark-shared = { path = "../shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Storage",
    "Window",
] }
